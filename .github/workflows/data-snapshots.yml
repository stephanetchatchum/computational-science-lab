name: Refresh data snapshots
# Downloads backup copies of the third-party datasets the guides use (audit item A3)
# and commits them to data/snapshots/. Run it by hand from the Actions tab, or wait for the monthly run.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_data.py
      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh data snapshots" && git push; fi
